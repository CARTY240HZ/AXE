name: AXE Release

# Release is split into two trust zones:
#   1) build-package: read-only repository token; builds, tests, signs (if configured) and packages.
#   2) publish: write/attestation permissions only on a version tag; consumes the immutable artifact.
# Pull requests therefore never receive a write-capable release token.
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ axe, main ]
    paths:
      - 'AXE/scripts/New-AXERelease.ps1'
      - 'AXE/scripts/New-AXEWingetManifest.ps1'
      - 'AXE/src/43-update.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Pester + PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction Stop
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: Build + gate completo
        shell: pwsh
        run: ./AXE/build.ps1 -CI

      - name: Coherencia tag <-> VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v',''
          $ver = (Get-Content AXE/VERSION -Raw).Trim()
          if ($tag -ne $ver) {
            Write-Host "::error::El tag '${{ github.ref_name }}' no coincide con AXE/VERSION ('$ver')."
            exit 1
          }
          Write-Host "tag y VERSION coinciden: $ver"

      - name: Preparar certificado (si hay secret)
        id: cert
        env:
          PFX: ${{ secrets.AXE_CODESIGN_PFX_BASE64 }}
        shell: pwsh
        run: |
          if (-not $env:PFX) { Write-Host 'Sin secret de firma: se omite.'; exit 0 }
          $path = Join-Path $env:RUNNER_TEMP 'axe-cs.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Artefactos de release (firmados si hay cert)
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.cert.outputs.path }}
          PFX_PASS: ${{ secrets.AXE_CODESIGN_PFX_PASSWORD }}
        run: |
          $p = @{ SkipBuild = $true }
          if ($env:PFX_PATH) {
            $p.PfxPath = $env:PFX_PATH
            if ($env:PFX_PASS) { $p.PfxPassword = (ConvertTo-SecureString $env:PFX_PASS -AsPlainText -Force) }
          } else {
            Write-Warning 'Sin secret de firma: el release saldra SIN FIRMAR.'
          }
          ./AXE/scripts/New-AXERelease.ps1 @p

      - name: Borrar el certificado del runner
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'axe-cs.pfx') -Force -ErrorAction SilentlyContinue

      - name: Verificar SHA256SUMS
        shell: pwsh
        run: |
          $sumsPath = Join-Path $PWD 'AXE/dist/release/SHA256SUMS'
          if (-not (Test-Path -LiteralPath $sumsPath -PathType Leaf)) { throw 'Falta SHA256SUMS.' }
          $bad = New-Object System.Collections.ArrayList
          $seen = @{}
          foreach($line in (Get-Content -LiteralPath $sumsPath -Raw -Encoding UTF8 -Delimiter "`0" -ErrorAction Stop -Raw)) {
            foreach($row in ($line -split "`r?`n")) {
              if([string]::IsNullOrWhiteSpace($row)){ continue }
              if($row -notmatch '^\s*([0-9a-fA-F]{64})\s+\*?(.+?)\s*$'){ [void]$bad.Add("linea ilegible: $row"); continue }
              $hash = $Matches[1]; $name = $Matches[2]
              $seen[$name] = $true
              $path = Join-Path (Join-Path $PWD 'AXE/dist/release') $name
              if(-not (Test-Path -LiteralPath $path -PathType Leaf)){ [void]$bad.Add("ausente: $name"); continue }
              $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              if(-not [string]::Equals($actual,$hash,[StringComparison]::OrdinalIgnoreCase)){ [void]$bad.Add("hash no cuadra: $name") }
            }
          }
          if($seen.Count -eq 0){ [void]$bad.Add('SHA256SUMS vacio') }
          if($bad.Count){ throw ("SHA256SUMS invalido: {0}" -f ($bad -join '; ')) }
          Write-Host 'SHA256SUMS verificado.'

      - name: Artifact release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AXE-release
          path: AXE/dist/release
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AXE-release
          path: AXE/dist/release

      - name: Verify downloaded bundle
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'AXE/dist/release'
          $sumsPath = Join-Path $dir 'SHA256SUMS'
          if (-not (Test-Path -LiteralPath $sumsPath -PathType Leaf)) { throw 'Falta SHA256SUMS en el artefacto.' }
          $bad = New-Object System.Collections.ArrayList
          $seen = @{}
          $text = Get-Content -LiteralPath $sumsPath -Raw -Encoding UTF8
          foreach($row in ($text -split "`r?`n")) {
            if([string]::IsNullOrWhiteSpace($row)){ continue }
            if($row -notmatch '^\s*([0-9a-fA-F]{64})\s+\*?(.+?)\s*$'){ [void]$bad.Add("linea ilegible: $row"); continue }
            $hash = $Matches[1]; $name = $Matches[2]
            $seen[$name] = $true
            $path = Join-Path $dir $name
            if(-not (Test-Path -LiteralPath $path -PathType Leaf)){ [void]$bad.Add("ausente: $name"); continue }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if(-not [string]::Equals($actual,$hash,[StringComparison]::OrdinalIgnoreCase)){ [void]$bad.Add("hash no cuadra: $name") }
          }
          if($seen.Count -eq 0){ [void]$bad.Add('SHA256SUMS vacio') }
          if($bad.Count){ throw ("Artefacto descargado invalido: {0}" -f ($bad -join '; ')) }
          Write-Host 'Artefacto descargado verificado.'

      - name: Determine Authenticode state
        id: sig
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -LiteralPath ./AXE/dist/release/AXE.ps1
          $signed = ($sig.Status -eq 'Valid')
          "signed=$($signed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Authenticode: $($sig.Status)"

      - name: Attestation de procedencia
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            AXE/dist/release/AXE.ps1
            AXE/dist/release/AXE-*.zip

      - name: Publicar release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            AXE/dist/release/AXE.ps1
            AXE/dist/release/AXE-*.zip
            AXE/dist/release/SHA256SUMS
            AXE/dist/release/sbom.json
          generate_release_notes: true
          body: |
            ## Verifica antes de ejecutar

            **Estado de la firma: `${{ steps.sig.outputs.signed == 'true' && 'FIRMADO (Authenticode + timestamp RFC3161)' || 'SIN FIRMAR' }}`**

            ```powershell
            (Get-FileHash .\AXE.ps1 -Algorithm SHA256).Hash.ToLower()
            Get-AuthenticodeSignature .\AXE.ps1 | Format-List Status, SignerCertificate
            ```

            La attestation de procedencia se publica separada del release y permite verificar que
            los bytes proceden de este repositorio, commit y workflow. El checksum demuestra
            integridad; Authenticode, cuando esta presente, aporta confianza para Windows.
