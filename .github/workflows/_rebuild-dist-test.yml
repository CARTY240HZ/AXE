name: AXE rebuild dist test

on:
  push:
    branches:
      - ai/least-privilege-broker-2026-09-17

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: ./AXE/build.ps1
      - name: Commit fresh dist and remove temporary workflow
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AXE/dist/AXE.ps1 .github/workflows/_rebuild-dist-test.yml
          git rm -f .github/workflows/_rebuild-dist-test.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'build: sync dist after timer sweep fix'
          git remote set-url origin "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git push origin HEAD:${{ github.ref_name }}
