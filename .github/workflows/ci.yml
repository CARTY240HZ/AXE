name: AXE CI

on:
  push:
    branches: [ axe ]
  pull_request:
    branches: [ axe ]

# Default-deny for the workflow token. CI only reads the repository.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction Stop
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop

      - name: ScriptAnalyzer (Error gate)
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path AXE/src -Recurse -Severity Error
          if ($r) { $r | Format-Table RuleName,ScriptName,Line,Message -Auto; throw "ScriptAnalyzer: $($r.Count) errores" }
          Write-Host "ScriptAnalyzer: 0 errores"

      - name: Build (concat src -> dist)
        shell: pwsh
        run: ./AXE/build.ps1

      - name: Anti-deriva dist (dist == build fresco de src)
        shell: pwsh
        run: |
          $head = (git show HEAD:AXE/dist/AXE.ps1) -notmatch '^# Build UTC:'
          $work = (Get-Content AXE/dist/AXE.ps1)   -notmatch '^# Build UTC:'
          if (Compare-Object $head $work) {
            Write-Host '::error::dist/AXE.ps1 no coincide con un build fresco de src/. Corre ./AXE/build.ps1 y commitea el resultado.'
            exit 1
          }
          Write-Host 'dist/AXE.ps1 coherente con src/.'

      - name: SelfTest (schema + coherencia, CLI headless)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File AXE/dist/AXE.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "SelfTest fallo (exit $LASTEXITCODE)" }

      - name: Pester (unit, excluye integration)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File AXE/scripts/Invoke-AXETests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { throw "Suite Pester fallo (exit $LASTEXITCODE)" }

      - name: Artifact dist/AXE.ps1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AXE-dist
          path: AXE/dist/AXE.ps1
          if-no-files-found: warn

  integration:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction Stop
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop

      - name: Pester (integration, Windows real)
        shell: pwsh
        env:
          AXE_INTEGRATION: '1'
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'AXE/tests'
          $cfg.Filter.Tag = 'integration'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
