name: AXE pilot signed release

on:
  push:
    branches:
      - release/pilot-7.1.0-signed-2026-09-18

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Rebuild dist from source
        shell: pwsh
        run: ./AXE/build.ps1 -NoTest

      - name: Create pilot signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $PWD 'AXE\CERTIFICATE'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=AXE Pilot Code Signing, O=CARTY240HZ' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(3)
          if (-not $cert) { throw 'No se pudo crear el certificado de piloto.' }

          Export-Certificate -Cert $cert -FilePath (Join-Path $dir 'AXE-Pilot-CodeSigning.cer') | Out-Null
          $cert.Thumbprint | Set-Content -LiteralPath (Join-Path $dir 'THUMBPRINT.txt') -Encoding ASCII
          Write-Host "Thumbprint: $($cert.Thumbprint)"

      - name: Sign AXE.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq 'CN=AXE Pilot Code Signing, O=CARTY240HZ' } | Sort-Object NotAfter -Descending | Select-Object -First 1
          if (-not $cert) { throw 'Certificado de firma no encontrado.' }

          $sig = Set-AuthenticodeSignature -FilePath 'AXE\dist\AXE.ps1' -Certificate $cert -HashAlgorithm SHA256
          Write-Host "Sign status: $($sig.Status)"
          if ($sig.Status -notin @('Valid','UnknownError','NotTrusted')) {
            throw "La firma Authenticode fallo: $($sig.Status)"
          }

      - name: Trust pilot certificate and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cer = Join-Path $PWD 'AXE\CERTIFICATE\AXE-Pilot-CodeSigning.cer'

          certutil.exe -user -addstore -f Root "$cer" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo registrar el certificado en Root.' }

          certutil.exe -user -addstore -f TrustedPublisher "$cer" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo registrar el certificado en TrustedPublisher.' }

          $sig = Get-AuthenticodeSignature -LiteralPath 'AXE\dist\AXE.ps1'
          Write-Host "Verified status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($sig.SignerCertificate.Thumbprint)"
          if ($sig.Status -ne 'Valid') { throw "AXE.ps1 no queda Valid: $($sig.Status)" }

      - name: Add pilot launch instructions
        shell: pwsh
        run: |
          @'
          AXE 7.1.0 — PILOTO CERRADO
          ===========================

          Este paquete contiene AXE.ps1 firmado con un certificado de firma AUTOGENERADO
          exclusivamente para el piloto. No es un certificado de una CA pública.

          PRIMERA VEZ:
            1. Descomprime todo el ZIP.
            2. Ejecuta CERTIFICATE\INSTALL-AXE-PILOT-TRUST.bat.
            3. Después ejecuta AXE.bat.

          La instalación de confianza solo afecta al usuario actual y usa el certificado
          público .cer incluido. NO se distribuye ninguna clave privada.

          PARA DEJAR DE CONFIAR:
            Ejecuta CERTIFICATE\REMOVE-AXE-PILOT-TRUST.bat

          IMPORTANTE:
            - La firma cubre AXE\dist\AXE.ps1.
            - El ZIP en sí no es un contenedor Authenticode; la comprobación importante
              para el broker es la firma Authenticode del AXE.ps1 que se ejecuta.
            - Para un lanzamiento público se necesita un certificado de firma de código
              emitido por una CA o un proveedor de firma confiable. Este paquete es solo
              para un grupo pequeño que acepta instalar explícitamente esta confianza.
          '@ | Set-Content -LiteralPath 'AXE\PILOT-README.txt' -Encoding UTF8

          @'
          @echo off
          setlocal
          set "CERT=%~dp0AXE-Pilot-CodeSigning.cer"
          if not exist "%CERT%" (
              echo ERROR: no se encuentra "%CERT%"
              exit /b 1
          )
          echo Instalando confianza de AXE Pilot para el usuario actual...
          certutil.exe -user -addstore -f Root "%CERT%"
          if errorlevel 1 exit /b 1
          certutil.exe -user -addstore -f TrustedPublisher "%CERT%"
          if errorlevel 1 exit /b 1
          echo.
          echo OK. Ahora puedes lanzar AXE.bat.
          pause
          endlocal
          '@ | Set-Content -LiteralPath 'AXE\CERTIFICATE\INSTALL-AXE-PILOT-TRUST.bat' -Encoding ASCII

          @'
          @echo off
          setlocal
          certutil.exe -user -delstore Root "AXE Pilot Code Signing"
          certutil.exe -user -delstore TrustedPublisher "AXE Pilot Code Signing"
          echo.
          echo Confianza de AXE Pilot retirada (si estaba instalada).
          pause
          endlocal
          '@ | Set-Content -LiteralPath 'AXE\CERTIFICATE\REMOVE-AXE-PILOT-TRUST.bat' -Encoding ASCII

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'AXE-7.1.0-PILOT-SIGNED.zip'
          Compress-Archive -Path 'AXE' -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  AXE-7.1.0-PILOT-SIGNED.zip" | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'AXE-7.1.0-PILOT-SIGNED-SHA256.txt') -Encoding ASCII
          Write-Host "ZIP SHA256: $sha"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AXE-7.1.0-PILOT-SIGNED
          path: |
            ${{ runner.temp }}/AXE-7.1.0-PILOT-SIGNED.zip
            ${{ runner.temp }}/AXE-7.1.0-PILOT-SIGNED-SHA256.txt
          if-no-files-found: error
