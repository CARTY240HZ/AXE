name: AXE rebuild dist test

on:
  push:
    branches:
      - ai/least-privilege-broker-2026-09-17

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: ./AXE/build.ps1
      - name: Upload fresh dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AXE-dist-fixed
          path: AXE/dist/AXE.ps1
          if-no-files-found: error
