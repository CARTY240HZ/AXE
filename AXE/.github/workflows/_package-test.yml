name: AXE test package

on:
  push:
    branches:
      - ai/least-privilege-broker-2026-09-17

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build and test fresh dist
        shell: pwsh
        run: ./AXE/build.ps1

      - name: Remove CI-only workflow and git metadata
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.git' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'AXE/.github/workflows/_package-test.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'AXE/.github/workflows/_rebuild-dist-once.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'AXE/.github/workflows/_rebuild-dist-test.yml' -Force -ErrorAction SilentlyContinue

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'AXE' -DestinationPath "$env:RUNNER_TEMP\AXE-test.zip" -CompressionLevel Optimal

      - name: Upload complete project ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AXE-test-complete
          path: ${{ runner.temp }}/AXE-test.zip
          if-no-files-found: error
